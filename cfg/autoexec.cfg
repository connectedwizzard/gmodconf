
//-novid -dxlevel 90 -high -console -nod3d9ex -nojoy -processheap -nosteamcontroller -softparticlesdefaultoff -nohltv -particles 1 -useforcedmparms -noforcemaccel -noforcemspd -primarysound -snoforceformat -heapsize "16777216" +exec autoexec.cfg
connect 194.69.160.61:27015

// Alias
alias "q" "quit"
alias "d" "disconnect"
alias "c" "connect"
alias "c1" "connect 194.69.160.61:27015"
alias "k" "kill"
alias "e" "exec"

// Bind
bind t "+alt1"
bind v "+alt2"
bind p "say i like trains"
bind o "stopsounds"

// Multi-core rendering
gmod_mcore_test 1
mat_queue_mode -1
cl_threaded_bone_setup 1

// Set DirectX 90
mat_dxlevel 90

// Disable lightmap filtering
mat_filterlightmaps 0

// Disable texture filtering
mat_filtertextures 0

// Disable mipmapping
mat_mipmaptextures 0

// Low-resolution texture
mat_picmip 4

// low-resolution images
mat_showlowresimage 1

// LOD reduction
r_lod 2

// Additional optimizations
mat_specular 0
mat_hdr_level 0
mat_colorcorrection 0
mat_antialias 0
mat_forceaniso 0
mat_trilinear 0
r_shadows 1 // if set 0, flashlight wont work
r_shadowrendertotexture 0
r_shadowdist 500
//r_eyes 0
r_eyegloss 0
r_eyemove 0
r_teeth 0
r_flex 0
r_dynamic 0
r_propsmaxdist 1000
cl_detailfade 400
cl_detaildist 800

// Blur
mat_motion_blur_enabled 0
mat_motion_blur_falling_intensity 0
mat_motion_blur_falling_max 0
mat_motion_blur_falling_min 0
mat_motion_blur_forward_enabled 0
mat_motion_blur_percent_of_screen_max 0
mat_motion_blur_rotation_intensity 0
mat_motion_blur_strength 0

// FPS limit
fps_max 270

// Net graph
net_graphproportionalfont 0
net_graphpos 2
net_graph 1

// Lower audio quality
snd_spatialize_roundrobin 1
snd_mix_async 1
snd_async_fullyasync 1
snd_pitchquality 0
dsp_slow_cpu 1
snd_mixahead 0.1
dsp_enhance_stereo 0

// Forced preloading
cl_forcepreload 1
sv_forcepreload 1

// Optimized network
rate 60000
cl_cmdrate 66
cl_updaterate 66
cl_interp 0
cl_interp_ratio 1

// Disable joystick
joystick 0

// More
r_flashlightdepthres 8
r_shadowmaxrendered 8
r_projectedtexture_filter 0
r_flashlightdepthtexture 0

// Echo
echo "loaded config"
echo "loaded config"
echo "loaded config"
echo "loaded config"
echo "loaded config"
echo "loaded config"